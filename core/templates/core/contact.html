{% extends "core/base.html" %}
{% block title %}Contact - DOCBOT{% endblock %}
{% block content %}
<section class="py-5 mt-5">
  <div class="container">
    <div style="max-width:600px;margin:0 auto;background:#fff;padding:40px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.08);">
      <h2 class="text-center mb-4">Contact Us</h2>
      
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}

      <form method="POST" action="{% url 'contact' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" name="name" class="form-control" placeholder="Enter your name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" name="message" rows="5" placeholder="Write your message" required></textarea>
        </div>
        <button class="btn-main w-100" style="text-align:center;" type="submit">Send Message</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
