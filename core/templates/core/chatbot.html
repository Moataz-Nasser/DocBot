{% extends "core/base.html" %}
{% block title %}DocBot Chat{% endblock %}
{% block extra_css %}
<style>
.chat-wrapper{margin-top:100px;margin-bottom:40px;}
.chat-shell{
  width:100%;max-width:1000px;height:70vh;margin:0 auto;
  background:rgba(255,255,255,0.6);backdrop-filter:blur(18px);
  border-radius:28px;box-shadow:0 25px 60px rgba(0,0,0,0.08);
  display:flex;flex-direction:column;overflow:hidden;
}
.chat-header{padding:18px 25px;border-bottom:1px solid rgba(0,0,0,0.06);display:flex;justify-content:space-between;align-items:center;}
.chat-title{font-weight:600;color:#111827;}
.status{font-size:12px;padding:5px 10px;background:#dcfce7;color:#166534;border-radius:20px;}
.chat-body{flex:1;display:flex;align-items:center;justify-content:center;color:#6b7280;text-align:center;padding:30px;}
.chat-placeholder h3{color:#111827;font-weight:600;}
.chat-input{padding:15px;border-top:1px solid rgba(0,0,0,0.06);display:flex;gap:10px;background:rgba(255,255,255,0.8);}
.chat-input input{flex:1;border:none;outline:none;padding:12px 15px;border-radius:25px;background:#f3f4f6;}
.send-btn{width:45px;height:45px;border-radius:50%;border:none;background:#4f46e5;color:#fff;font-size:18px;cursor:pointer;}

</style>
{% endblock %}

{% block content %}
<div class="chat-wrapper">
  <div class="chat-shell">
    <div class="chat-header">
      <div class="chat-title">AI Medical Assistant</div>
      <div class="status">● Online</div>
    </div>
    <div class="chat-body" id="chat-root">
      <div class="chat-placeholder">
        <h3>Tell me your symptoms 👋</h3>
        <p class="text-muted">The chatbot integration will be connected here.</p>
      </div>
    </div>
    <div class="chat-input">
      <input type="text" placeholder="Type your symptoms...">
      <button class="send-btn">➤</button>
    </div>
  </div>
</div>
{% endblock %}
