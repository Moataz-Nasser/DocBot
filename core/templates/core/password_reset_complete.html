<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Password Reset Complete | DOCBOT</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#0f172a,#020617);}.glow{position:fixed;width:400px;height:400px;background:#4f46e5;filter:blur(140px);opacity:0.3;border-radius:50%;top:-100px;left:-100px;}.card-pw{width:400px;padding:30px;border-radius:20px;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);color:white;z-index:2;text-align:center;animation:fadeUp .8s ease;}@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.btn-submit{display:inline-block;margin-top:20px;padding:12px 30px;border:none;border-radius:10px;background:linear-gradient(135deg,#4f46e5,#6366f1);color:white;font-weight:bold;text-decoration:none;transition:0.3s;}.btn-submit:hover{transform:scale(1.05);color:white;}</style>
</head><body><div class="glow"></div>
<div class="card-pw">
  <h2>Password Reset ✅</h2>
  <p style="color:rgba(255,255,255,0.7);margin-top:15px;">Your password has been set successfully. You can now log in with your new password.</p>
  <a href="{% url 'login' %}" class="btn-submit">Go to Login</a>
</div></body></html>
