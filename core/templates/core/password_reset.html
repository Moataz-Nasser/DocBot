<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | DOCBOT</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#0f172a,#020617);}
.glow{position:fixed;width:400px;height:400px;background:#4f46e5;filter:blur(140px);opacity:0.3;border-radius:50%;top:-100px;left:-100px;}
.card-pw{width:400px;padding:30px;border-radius:20px;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);color:white;z-index:2;animation:fadeUp .8s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.form-input{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;outline:none;background:rgba(255,255,255,0.1);color:white;}
.form-input::placeholder{color:rgba(255,255,255,0.5);}
.btn-submit{width:100%;margin-top:20px;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#4f46e5,#6366f1);color:white;font-weight:bold;cursor:pointer;transition:0.3s;}
.btn-submit:hover{transform:scale(1.05);}
.back-link{text-align:center;margin-top:15px;}
.back-link a{color:#a5b4fc;text-decoration:none;font-size:14px;}
.error-list{list-style:none;padding:0;margin:5px 0;}
.error-list li{color:#f87171;font-size:13px;}
</style>
</head>
<body>
<div class="glow"></div>
<div class="card-pw">
  <h2 class="text-center" style="margin-bottom:10px;">Reset Password</h2>
  <p style="text-align:center;color:rgba(255,255,255,0.6);font-size:14px;">Enter your email and we'll send you instructions to reset your password.</p>
  <form method="post">
    {% csrf_token %}
    <input type="email" name="email" class="form-input" placeholder="Enter your email address" required>
    <button type="submit" class="btn-submit">Send Reset Link</button>
  </form>
  <div class="back-link"><a href="{% url 'login' %}">&larr; Back to Login</a></div>
</div>
</body></html>
