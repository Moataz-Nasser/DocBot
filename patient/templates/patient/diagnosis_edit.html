{% extends "core/dashboard_base.html" %}

{% block title %}Edit Diagnosis - DOCBOT{% endblock %}
{% block page_title %}Edit Diagnosis{% endblock %}

{% block content %}
<div class="content-card" style="max-width: 600px; margin: 0 auto;">
    <h5 class="mb-4 pb-3 border-bottom">Edit Diagnosis Record</h5>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Diagnosis</label>
            <input type="text" name="diagnosis_name" class="form-control" value="{{ diagnosis.diagnosis_name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Diagnosing Doctor</label>
            <input type="text" name="doctor_name" class="form-control" value="{{ diagnosis.doctor_name|default:'' }}">
        </div>
        <div class="mb-4">
            <label class="form-label">Date of Diagnosis</label>
            <input type="date" name="date" class="form-control" value="{{ diagnosis.date|date:'Y-m-d' }}" required>
        </div>
        
        <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'patient_diagnoses' %}" class="btn-outline-custom">Cancel</a>
            <button type="submit" class="btn-primary-custom">Update Record</button>
        </div>
    </form>
</div>
{% endblock %}
